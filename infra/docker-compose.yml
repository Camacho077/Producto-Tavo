# =============================================================================
# Producto Tavo — servicios en Docker (Postgres + backend + n8n).
#
# CONFIGURACIÓN CRÍTICA — NO se borra ni se "simplifica" en limpiezas.
# Este equipo corre AL MISMO TIEMPO el Producto JS, cuyo compose también vive
# en una carpeta llamada infra/. Sin `name: tavo`, Docker tomaría el nombre
# de la carpeta ("infra") para los dos, y este compose reutilizaría (o
# borraría con `down -v`) los contenedores y el volumen `infra_db_data` del
# Producto JS. Por eso: nombre de proyecto, contenedores y volúmenes propios.
#
# Mapa de puertos (docs/DECISIONES.md §1). Hacia afuera solo se publican:
#   Postgres 5433 (el 5432 es del Producto JS) · backend 8002 · n8n 5679
#   (frontend 5175 solo con el perfil "frontend"; normalmente corre con Vite).
# Dentro de Docker los servicios se hablan por su nombre de servicio:
#   backend -> postgresql://...@db:5432/tavo_erp
#   backend -> http://n8n:5678   ·   n8n -> http://backend:8002/api/v1
#
# Uso (desde la raíz del repo):
#   docker compose -f infra/docker-compose.yml up -d db          # solo Postgres
#   docker compose -f infra/docker-compose.yml up -d             # db + backend + n8n
#   docker compose -f infra/docker-compose.yml --profile frontend up -d
# Antes de arrancar: automatizaciones/dev/verificar-puertos.ps1
# =============================================================================
name: tavo

services:
  db:
    image: postgres:16-alpine
    container_name: tavo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tavo_admin
      POSTGRES_PASSWORD: tavo_admin
      POSTGRES_DB: tavo_erp
    ports:
      - "5433:5432"
    volumes:
      - tavo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tavo_admin -d tavo_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    image: tavo-backend
    container_name: tavo-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql://tavo_admin:tavo_admin@db:5432/tavo_erp
      PORT: "8002"
    ports:
      # Mismo puerto dentro y fuera: app/core/arranque.py exige que uvicorn
      # escuche en Settings.PORT.
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8002"

  n8n:
    image: n8nio/n8n:2.42.7
    container_name: tavo-n8n
    restart: unless-stopped
    environment:
      N8N_PORT: "5678"
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      # URL con la que n8n arma sus webhooks: el puerto PUBLICADO (5679).
      WEBHOOK_URL: http://localhost:5679/
      N8N_EDITOR_BASE_URL: http://localhost:5679/
      # Solo en local por http: sin esto n8n exige https para la cookie.
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    ports:
      - "5679:5678"
    volumes:
      - tavo_n8n_data:/home/node/.n8n

  frontend:
    profiles: ["frontend"]
    build:
      context: ../frontend
    image: tavo-frontend
    container_name: tavo-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8002/api/v1
    ports:
      - "5175:5175"
    depends_on:
      - backend

volumes:
  tavo_db_data:
    name: tavo_db_data
  tavo_n8n_data:
    name: tavo_n8n_data
