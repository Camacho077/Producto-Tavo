[pytest]
pythonpath = .
# datetime.utcnow() está deprecado (Python 3.12+) y llegó a producir más de
# 6.400 avisos por corrida. Si vuelve, la suite FALLA: usar
# app.core.tiempo.ahora_utc() (UTC naive) o datetime.now(timezone.utc).
filterwarnings =
    error:datetime\.datetime\.utcnow:DeprecationWarning
