<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA (fase 7): instalable en celular y tablet. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png" />
    <meta name="theme-color" content="#18181B" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Restaurante</title>
    <!-- Modo guardado ANTES del primer pintado: sin esto, quien eligió el
         oscuro veía un cuadro en claro hasta que React montaba. Misma clave y
         mismos valores que theme/ThemeContext.jsx. -->
    <script>
      try {
        var m = localStorage.getItem("js_company_modo");
        if (m === "claro" || m === "oscuro") document.documentElement.setAttribute("data-theme", m);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
